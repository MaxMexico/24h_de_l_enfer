name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # Les scripts navigateur ne tournent pas en CI : inutile de
          # télécharger Chromium à chaque build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Tests du moteur de planning
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Vérifier que les variables ont bien été injectées
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::VITE_SUPABASE_URL est absente du bundle."
            echo "Vérifier les secrets du dépôt (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
